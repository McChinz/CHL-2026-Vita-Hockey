name: Build VPK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: (apk add --no-cache cmake make xz git unzip) || (apt-get update && apt-get install -y cmake make xz-utils git unzip) || true
      - name: Libraries
        run: |
          vdpm libvita2d || true
          vdpm freetype || true
          vdpm libpng || true
          vdpm zlib || true
          vdpm libjpeg-turbo || true
      - name: Unpack project
        run: unzip -o GoalieSimVita.zip
      - name: Build
        run: |
          cd GoalieSimVita
          cmake -S vita -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - uses: actions/upload-artifact@v4
        with:
          name: GoalieSim-vpk
          path: GoalieSimVita/build/*.vpk
