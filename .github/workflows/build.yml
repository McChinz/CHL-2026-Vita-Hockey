name: Build VPK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: (apk add --no-cache cmake make xz git unzip) || (apt-get update && apt-get install -y cmake make xz-utils git unzip) || true
      - name: Libraries
        run: |
          vdpm libvita2d || true
          vdpm freetype || true
          vdpm libpng || true
          vdpm zlib || true
          vdpm libjpeg-turbo || true
          vdpm vitaGL || true
          vdpm vitaShaRK || true
          vdpm libmathneon || true
          vdpm SceShaccCgExt || true
          vdpm taihen || true
      - name: Unpack project
        run: unzip -o GoalieSimVita.zip
      # the JS build (CHL 2026, GOAL00001) - unchanged
      - name: Build
        run: |
          cd GoalieSimVita
          cmake -S vita -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - uses: actions/upload-artifact@v4
        with:
          name: GoalieSim-vpk
          path: GoalieSimVita/build/*.vpk
      # the native C++ build (CHL 2026 NATIVE, GOAL00002), vitaGL renderer. The JS build above uploads even if this fails.
      - name: Build native (C++, vitaGL)
        continue-on-error: true
        run: |
          cd GoalieSimVita
          cmake -S cpp -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native -j4 2>&1 | tee native-build.log
          test -f build-native/CHL2026Native.vpk
      # the same game on the vita2d renderer (fallback: no depth buffer, no libshacccg needed)
      - name: Build native (C++, vita2d fallback)
        continue-on-error: true
        run: |
          cd GoalieSimVita
          cmake -S cpp -B build-native2d -DCMAKE_BUILD_TYPE=Release -DRENDERER=vita2d
          cmake --build build-native2d -j4 2>&1 | tee native2d-build.log
          test -f build-native2d/CHL2026Native-vita2d.vpk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GoalieSim-native-vpk
          path: |
            GoalieSimVita/build-native/*.vpk
            GoalieSimVita/build-native2d/*.vpk
            GoalieSimVita/native-build.log
            GoalieSimVita/native2d-build.log
